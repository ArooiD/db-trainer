name: Build static artifact

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build browser distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static distribution
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist-standalone/index.html
          echo "Static build is ready"
          du -sh dist dist-standalone

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-trainer-static-${{ github.sha }}
          path: |
            dist/
            dist-standalone/index.html
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
