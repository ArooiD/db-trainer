<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="IT Study Lab — интерактивная лабораторная среда для подготовки студентов по IT-дисциплинам." />
  <title>IT Study Lab — Базы данных</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/lab.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <div class="brand">IT Study Lab</div>
      <div class="brand-subtitle">Базы данных · SQL Lab</div>
    </div>
    <div class="runtime-switch">
      <label for="engine-select">Движок</label>
      <select id="engine-select" aria-label="Выбор SQL-движка"></select>
      <span class="runtime-status" id="engine-status">инициализация…</span>
    </div>
    <div class="progress" id="progress">Прогресс: …</div>
    <div class="topbar-actions">
      <button id="btn-schema" class="ghost">Схема БД</button>
      <button id="btn-design" class="ghost">Спроектировать</button>
      <button id="btn-sandbox" class="ghost">Свободный режим</button>
      <button id="btn-reset" class="ghost danger">Сбросить прогресс</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">Базы данных · задания</div>
      <nav id="task-list" class="task-list"></nav>
    </aside>

    <section class="content">
      <div class="task-head">
        <div>
          <div class="task-level" id="task-level"></div>
          <h2 id="task-title"></h2>
        </div>
        <span id="task-status" class="badge"></span>
      </div>
      <p class="task-desc" id="task-desc"></p>

      <div class="controls">
        <button id="btn-run" class="primary">▶ Проверить</button>
        <button id="btn-hint" class="ghost">Подсказка</button>
        <button id="btn-solution" class="ghost">Показать решение</button>
        <button id="btn-clear" class="ghost">Очистить</button>
      </div>

      <textarea id="editor" spellcheck="false" placeholder="Введите SQL-запрос..."></textarea>

      <div id="feedback" class="feedback hidden"></div>

      <div class="results">
        <div class="results-col">
          <div class="results-caption">Результат вашего запроса</div>
          <div id="user-result" class="result-box"></div>
        </div>
        <div class="results-col">
          <div class="results-caption">Ожидаемый результат</div>
          <div id="expected-result" class="result-box"></div>
        </div>
      </div>

      <div class="hint-box hidden" id="hint-box"></div>
      <div class="solution-box hidden" id="solution-box"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-body">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="vendor/sql-wasm.js"></script>
  <script src="vendor/sql-binary.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/engines/lab-engine.js"></script>
  <script src="js/engines/runtime.js"></script>
  <script src="js/engines/sqlite-engine.js"></script>
  <script src="js/engines/pglite-engine.js"></script>
  <script src="js/db.js"></script>
  <script src="js/design.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
